        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap');
        :root {
          --bg-dark: #03050a;
          --card-bg: rgba(11, 15, 25, 0.88);
          --gold: #c5a059;
          --gold-bright: #ffe082;
          --gold-gradient: linear-gradient(135deg, #8a6d3b 0%, #ffeaa7 50%, #8a6d3b 100%);
          --tantra-red: #8b0000;
          --tantra-glow: 0 0 25px rgba(139, 0, 0, 0.5);
          --gold-glow: 0 0 20px rgba(197, 160, 89, 0.3);
          --text-light: #f8f9fa;
          --text-muted: #94a3b8;
          --border-gold: rgba(197, 160, 89, 0.25);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; min-height:100vh; overflow-x:hidden; scroll-behavior:smooth; max-width:100%; }
        body { background: #03050a; overflow-x:hidden; margin:0; }
        .app-root {
          font-family: 'Poppins', sans-serif;
          background-color: var(--bg-dark);
          background-image: radial-gradient(circle at 50% 0%, #1a0814 0%, transparent 60%), radial-gradient(circle at 50% 100%, #081026 0%, var(--bg-dark) 80%);
          color: var(--text-light);
          line-height: 1.6;
          min-height: 100vh;
          width:100%;
          max-width:100%;
          overflow-x:clip;
          position:relative;
        }
        .hindi { font-family: 'Tiro Devanagari Hindi', serif; }
        .royal-title {
          font-family: 'Cinzel', serif;
          background: var(--gold-gradient);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
          font-weight: 700;
        }
        .panchang-ticker {
          background: linear-gradient(90deg, #4a0000, #c5a059, #4a0000);
          color: #fff;
          padding: 8px 0;
          font-size: 0.92rem;
          font-weight: 600;
          width: 100%;
          max-width:100%;
          overflow: hidden;
          white-space: nowrap;
          border-bottom: 1px solid var(--gold-bright);
          box-shadow: 0 2px 15px rgba(197, 160, 89, 0.3);
          position: relative;
          z-index: 1001;
          box-sizing:border-box;
        }
        .ticker-track {
          display:flex;
          width:max-content;
          animation: scrollText 30s linear infinite;
          will-change: transform;
        }
        .ticker-item { padding-right: 60px; white-space:nowrap; }
        .panchang-ticker:hover .ticker-track { animation-play-state: paused; cursor: pointer; }
        @keyframes scrollText { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        header.navbar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 16px 8%;
          background: rgba(3, 5, 10, 0.92);
          border-bottom: 1px solid var(--border-gold);
          position: sticky;
          top: 0;
          z-index: 1000;
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          max-width:100%;
          width:100%;
          box-sizing:border-box;
        }
        .logo { font-size: clamp(1.2rem, 2vw, 1.8rem); text-decoration: none; letter-spacing: 1px; }
        nav a { color: var(--text-light); text-decoration: none; margin-left: 22px; font-weight: 500; font-size: 0.95rem; transition: color 0.3s; letter-spacing: 1px; cursor: pointer; }
        nav a:hover, nav a.active { color: var(--gold-bright); text-shadow: 0 0 10px var(--gold); }

        .hero {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 50px 8%;
          max-width: 1250px;
          margin: 0 auto;
          gap: 40px;
          width:100%;
          box-sizing:border-box;
        }
        .hero-text { flex: 1.2; }
        .hero-text h1 { font-size: clamp(2rem, 4vw, 3.4rem); margin-bottom: 10px; line-height:1.15; }
        .hero-text .sub {
          font-size: 1.15rem;
          color: var(--gold-bright);
          margin-bottom: 18px;
          border-left: 4px solid var(--tantra-red);
          padding-left: 12px;
          background: rgba(139, 0, 0, 0.15);
          display: inline-block;
          padding-right: 15px;
          border-radius: 0 8px 8px 0;
          padding-top:6px; padding-bottom:6px;
          font-weight:500;
        }
        .hero-text .desc { color: #cbd5e1; font-size: 1.05rem; margin-bottom: 28px; max-width: 560px; }
        .hero-ctas { display:flex; gap:14px; flex-wrap:wrap; }
        .btn-royal {
          background: var(--gold-gradient);
          color: #03050a;
          border: none;
          padding: 14px 28px;
          font-weight: 700;
          font-size: 0.98rem;
          cursor: pointer;
          border-radius: 35px;
          transition: transform 0.2s, filter 0.2s, box-shadow 0.2s;
          text-transform: uppercase;
          letter-spacing: 0.8px;
          display:inline-flex; align-items:center; gap:8px;
          box-shadow: var(--gold-glow);
          text-decoration:none;
        }
        .btn-royal:hover { transform: translateY(-2px); filter: brightness(1.15); box-shadow: 0 8px 25px rgba(197,160,89,0.35); }
        .btn-wa {
          background: #25d366;
          color: #000;
          border: none;
          padding: 14px 28px;
          font-weight: 700;
          font-size: 0.98rem;
          cursor: pointer;
          border-radius: 35px;
          transition: transform 0.2s, filter 0.2s;
          display:inline-flex; align-items:center; gap:8px;
          text-decoration:none;
        }
        .btn-wa:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .hero-img { flex: 0.8; text-align: center; position: relative; }
        .hero-img-wrap { position:relative; display:inline-block; }
        .hero-avatar {
          width: clamp(260px, 26vw, 350px);
          height: clamp(260px, 26vw, 350px);
          border-radius: 50%;
          border: 4px solid var(--gold);
          padding: 6px;
          background: radial-gradient(circle at 30% 30%, #2a1a0a 0%, #0b0f19 60%, #03050a 100%);
          box-shadow: var(--tantra-glow), var(--gold-glow);
          transition: transform 0.4s ease;
          display:flex;
          align-items:center;
          justify-content:center;
          position:relative;
          overflow:hidden;
        }
        .hero-avatar:hover { transform: scale(1.03); }
        .hero-avatar-inner {
          width:100%; height:100%; border-radius:50%;
          background: linear-gradient(180deg, #3a2a1a 0%, #1a1210 100%);
          display:flex; align-items:center; justify-content:center;
          font-family:'Cinzel', serif; font-size:5rem; color: var(--gold-bright);
          border:1px solid rgba(197,160,89,0.2);
        }
        .hero-badge {
          position:absolute; bottom:18px; left:0px;
          background: var(--card-bg);
          border:1px solid var(--border-gold);
          padding:10px 14px;
          border-radius:12px;
          backdrop-filter: blur(8px);
          display:flex; align-items:center; gap:10px;
          box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .hero-badge .dot { width:8px; height:8px; background:#22c55e; border-radius:50%; box-shadow:0 0 8px #22c55e; }

        .section-wrap { max-width:1200px; margin: 0 auto; padding: 0 20px; box-sizing:border-box; width:100%; }
        .featured { margin: 10px auto 36px; }
        .pill {
          background: var(--card-bg);
          border:1px solid var(--border-gold);
          padding:10px 18px;
          border-radius:999px;
          font-size:0.85rem;
          font-weight:600;
          letter-spacing:0.8px;
          color: var(--text-light);
          transition: all 0.25s;
        }
        .pill:hover { border-color: var(--gold-bright); transform: translateY(-2px); box-shadow: var(--gold-glow); color: var(--gold-bright); }

        .features-grid {
          display:grid;
          grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
          gap:18px;
          margin: 28px auto 50px;
          max-width:1200px;
          padding: 0 20px;
          box-sizing:border-box;
          width:100%;
        }
        .feature-mini {
          background: var(--card-bg);
          border:1px solid var(--border-gold);
          border-radius:16px;
          padding:20px 18px;
          display:flex; align-items:center; gap:14px;
          transition: all 0.3s;
        }
        .feature-mini:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: var(--gold-glow); }
        .feature-mini .icon-box {
          width:44px; height:44px; border-radius:10px;
          background: linear-gradient(135deg, rgba(197,160,89,0.15), rgba(139,0,0,0.15));
          border:1px solid var(--border-gold);
          display:flex; align-items:center; justify-content:center;
          color: var(--gold-bright);
          flex-shrink:0;
        }

        .navgraha-bar {
          max-width: 1200px;
          width: calc(100% - 40px);
          margin: 20px auto 40px;
          padding: 24px 20px;
          background: var(--card-bg);
          border: 1px solid var(--border-gold);
          border-radius: 16px;
          text-align: center;
          box-shadow: var(--gold-glow);
          box-sizing:border-box;
        }
        .navgraha-grid {
          display: flex;

          align-items: center;
          flex-wrap: wrap;

          display: flex;

        .graha-icon {
          width:54px; height:54px; border-radius:50%;

          border:1px solid var(--border-gold);
          display:flex; align-items:center; justify-content:center;
          font-size:22px;
          box-shadow: 0 0 12px rgba(197,160,89,0.15);
        }
        .graha-item span { font-size: 0.78rem; color: var(--gold-bright); font-weight:600; letter-spacing:0.5px; }
        .graha-item small { font-size:0.66rem; color: var(--text-muted); }

        .services-section { max-width: 1200px; margin: 50px auto; padding: 0 20px; box-sizing:border-box; width:100%; }
        .section-title { text-align: center; font-size: clamp(1.6rem, 3vw, 2.4rem); margin-bottom: 10px; }
        .section-sub { text-align:center; color: var(--text-muted); font-size:0.95rem; margin-bottom:28px; }
        .tabs { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
        .tab-btn {
          padding:10px 20px;
          border-radius:999px;
          border:1px solid var(--border-gold);
          background: transparent;
          color: var(--text-muted);
          font-weight:600;
          font-size:0.9rem;
          cursor:pointer;
          transition: all 0.25s;
        }
        .tab-btn.active {
          background: var(--gold-gradient);
          color:#03050a;
          border-color: var(--gold);
          box-shadow: var(--gold-glow);
        }
        .tab-btn.pulse { animation: tabPulse 0.4s ease; }
        @keyframes tabPulse { 0%{transform:scale(0.96)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
        .services-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 22px;
          width:100%;
          max-width:100%;
          box-sizing:border-box;
        }
        .service-card {
          background: var(--card-bg);
          border: 1px solid var(--border-gold);
          padding: 28px 22px;
          border-radius: 18px;
          text-align: left;
          position: relative;
          overflow: hidden;
          transition: all 0.3s ease;
          width:100%;
          max-width:100%;
          box-sizing:border-box;
        }
        .service-card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; width: 100%; height: 3px;
          background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
        }
        .service-card:hover { transform: translateY(-8px); border-color: var(--gold-bright); box-shadow: var(--gold-glow); }
        .service-card i, .service-card .svc-icon { color: var(--gold-bright); margin-bottom: 14px; }
        .svc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .svc-tag { font-size:0.68rem; letter-spacing:0.8px; padding:4px 10px; border-radius:999px; background: rgba(197,160,89,0.12); border:1px solid var(--border-gold); color: var(--gold-bright); }

        .engine-section { max-width: 900px; margin: 60px auto; padding: 0 20px; box-sizing:border-box; width:100%; }
